name: Imagen (GHCR, amd64)

# Construye la imagen del provisioner en GitHub Actions (nunca en el servidor)
# y la publica en GitHub Container Registry. Se dispara al empujar una etiqueta
# de versión `prov-vX.Y.Z` o a mano.
#
#   ghcr.io/<dueño>/astracalls-provisioner:prov-v1.0.0  -> versión fija (usar esta en producción)
#   ghcr.io/<dueño>/astracalls-provisioner:latest       -> última versión publicada
#   ghcr.io/<dueño>/astracalls-provisioner:sha-<sha7>   -> versión fija por commit
#
# No usa secretos extra: publica con el GITHUB_TOKEN del propio repositorio.

on:
  push:
    tags: ['prov-v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: pruebas (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  image:
    name: imagen amd64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/astracalls-provisioner
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
